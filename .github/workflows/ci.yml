name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (biome)
        run: bunx biome ci .

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bun run build
        env:
          # Build only needs the vars to exist; pages fetch data at runtime.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

  e2e:
    needs: quality
    runs-on: ubuntu-latest
    # Playwright serves a production build, so the app env is needed for both
    # steps. No OpenRouter key: the suite's stub answers every model call, and
    # playwright.config.ts is what points the app at it.
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      OPENROUTER_API_KEY: sk-or-ci-stub
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install browser
        run: bunx playwright install --with-deps chromium

      - name: Build
        run: bun run build

      - name: E2E tests
        run: bun run test:e2e

      - name: Upload playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  ai-review:
    needs: e2e
    # reviews red builds too — that is when a second opinion is worth most —
    # and never blocks: the reviewer is a free model behind a rate limit
    if: always() && github.event_name == 'push'
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit comments
    steps:
      # full history so the push range (before..sha) can be diffed
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions

      # the test summary is optional context; a missing artifact is fine
      - name: Download e2e report
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: artifacts

      - name: Review the push
        run: bun run scripts/ai-review.ts
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIFF_BASE: ${{ github.event.before }}
          E2E_OUTCOME: ${{ needs.e2e.result }}
